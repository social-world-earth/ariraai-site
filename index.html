<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Arira AI — Something new is coming soon.">
  <meta name="theme-color" content="#101113">
  <title>Arira AI — Coming soon</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101113; color: #f5f5f3; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; text-align: center; }
    main { flex: 1; display: grid; place-items: center; padding: 64px 24px; }
    .content { width: 100%; max-width: 640px; }
    .mark { width: 32px; height: 2px; margin: 0 auto 32px; background: #c5bea5; }
    h1 { margin: 0; font-size: clamp(44px, 9vw, 76px); font-weight: 500; letter-spacing: -.055em; line-height: 1.1; }
    p { margin: 24px 0 0; font-size: clamp(17px, 3vw, 21px); line-height: 1.6; color: #a8aaae; }
    footer { padding: 24px; color: #777a80; font-size: 12px; letter-spacing: .03em; }
    @media (max-width: 420px) { main { padding: 48px 20px; } p { margin-top: 20px; } }
  </style>
</head>
<body>
  <main>
    <div class="content">
      <div class="mark" aria-hidden="true"></div>
      <h1>Arira AI</h1>
      <p>Something new is coming soon.</p>
    </div>
  </main>
  <footer>© 2026 Arira AI</footer>
</body>
</html>
